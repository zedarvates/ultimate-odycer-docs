name: Validate public documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/validate_docs.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/fresh_copy_check.py
      - name: Install HTML documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build and verify the real offline HTML bundle
        run: python -m unittest discover -s tests/integration -v
