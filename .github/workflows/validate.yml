name: Validate public documentation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Print changed documentation SHA-256
        run: |
          sha256sum README.md \
            docs/en/explanation/client-architecture.md \
            docs/en/reference/engine-template-world-matrix.md \
            docs/fr/explanation/client-architecture.md \
            docs/fr/reference/engine-template-world-matrix.md \
            docs/llm/README.md
      - run: python scripts/validate_docs.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/fresh_copy_check.py
