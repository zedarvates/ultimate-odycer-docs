site_name: Ultimate Odycer Local Setup
site_description: Bilingual local-first setup documentation for Ultimate Odycer
docs_dir: docs
site_dir: build/local-setup-html
use_directory_urls: false
strict: true

theme:
  name: mkdocs
  locale: en
  highlightjs: false

markdown_extensions:
  - fenced_code
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/ultimate-odycer-docs.css

exclude_docs: |
  superpowers/**

validation:
  links:
    not_found: info
